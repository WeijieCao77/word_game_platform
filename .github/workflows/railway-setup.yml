name: Railway one-time setup

# 一次性初始化：创建/关联 Railway 项目与服务、挂 /data Volume、配环境变量、
# 生成公网域名、完成首次部署。手动触发（workflow_dispatch），成功后日常
# 部署走 railway.yml。
#
# 需要的 Secrets（GitHub 仓库 Settings → Secrets and variables → Actions）：
#   RAILWAY_TOKEN   Railway token。账号 token（Account Settings → Tokens）或
#                   项目 token（项目 Settings → Tokens）都可以，脚本会自动识别
#   AI_API_KEY      可选，AI 供应商密钥；不配则先不开 AI
# 可选 Variables（同页面的 Variables 页签，非敏感）：
#   AI_BASE_URL     默认 https://api.openai.com/v1
#   AI_MODEL        默认 gpt-4o-mini

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      SERVICE: word-game-platform
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      AI_BASE_URL: ${{ vars.AI_BASE_URL || 'https://api.openai.com/v1' }}
      AI_MODEL: ${{ vars.AI_MODEL || 'gpt-5-mini' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup and deploy
        run: |
          set -e
          if [ -z "$TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN secret 未配置"; exit 1
          fi
          npm i -g @railway/cli
          railway --version

          # 识别 token 类型：账号 token 能 whoami；项目 token 不能，
          # 但自带项目上下文（无需 link/init）
          KIND=""
          if RAILWAY_API_TOKEN="$TOKEN" railway whoami 2>/dev/null; then
            KIND="account"
          elif RAILWAY_TOKEN="$TOKEN" railway status 2>/dev/null; then
            KIND="project"
          else
            echo "::error::token 无效：既不能作为账号 token（whoami 失败）也不能作为项目 token（status 失败）。请到 Railway 重新生成：Account Settings → Tokens（账号 token，workspace 选 Personal），复制后更新 GitHub secret RAILWAY_TOKEN，注意不要带多余空格。"
            exit 1
          fi
          echo "token 类型：$KIND"

          run_rw() {
            if [ "$KIND" = "account" ]; then
              RAILWAY_API_TOKEN="$TOKEN" railway "$@"
            else
              RAILWAY_TOKEN="$TOKEN" railway "$@"
            fi
          }

          if [ "$KIND" = "account" ]; then
            # 关联同名项目，不存在则创建
            if ! run_rw link --project "$SERVICE" --environment production 2>/dev/null; then
              run_rw init --name "$SERVICE"
            fi
          fi
          run_rw status || true

          run_rw add --service "$SERVICE" || echo "service 可能已存在，继续"
          # CLI 5.43 在非交互环境下带 -s 加卷会 panic：先把 service link 进上下文再加
          run_rw service "$SERVICE" || echo "service link 失败，继续"
          run_rw volume add --mount-path /data || echo "volume 添加失败或已存在，继续"
          run_rw volume list || true

          VAR_ARGS=(--service "$SERVICE" --skip-deploys \
            --set "DATA_DIR=/data" \
            --set "AI_BASE_URL=$AI_BASE_URL" \
            --set "AI_MODEL=$AI_MODEL")
          if [ -n "$AI_API_KEY" ]; then VAR_ARGS+=(--set "AI_API_KEY=$AI_API_KEY"); fi
          run_rw variables "${VAR_ARGS[@]}"

          run_rw domain --service "$SERVICE" || echo "domain 可能已存在，继续"
          run_rw up --service "$SERVICE" --detach

          echo "=== 最终状态 ==="
          run_rw status || true

      - name: Wait for deploy and smoke check
        run: |
          URL="https://word-game-platform-production.up.railway.app"
          echo "等待部署就绪：$URL"
          for i in $(seq 1 36); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$URL/" || echo 000)
            echo "check $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "✅ 平台已上线：$URL"
              echo "游戏库接口自检："
              curl -s "$URL/api/games" | head -c 400; echo
              exit 0
            fi
            sleep 10
          done
          echo "::warning::6 分钟内未返回 200，尝试抓取 Railway 构建日志"
          if RAILWAY_API_TOKEN="$TOKEN" timeout 40 railway logs --build -s "$SERVICE" 2>&1 | tail -120; then
            true
          else
            echo "（构建日志抓取失败或超时）"
          fi
        env:
          TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SERVICE: word-game-platform
