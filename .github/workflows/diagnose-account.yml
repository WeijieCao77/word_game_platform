name: 线上体检：手机端 + 账号归属

# 老板反复撞到同一件事：在电脑上点了「收录」，换手机登录同一个账号却看不到那部作品。
# 本地照着同样的流程跑（建作品 → 注册 → 收录 → 换一套 cookie 重新登录 → 查账号名下）
# 一次就过，所以问题在线上，不在这段逻辑。这条流水线就是去线上把真相取回来。
#
# 容器出口够不到 railway.app，所以只能在 Actions 的 runner 上问。

on:
  workflow_dispatch:
    inputs:
      probe_instances:
        description: "连着问几次 /api/health，看是不是多实例（每个进程一个 instance 号）"
        required: false
        default: "8"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      BASE: https://word-game-platform-production.up.railway.app
    steps:
      - name: 线上是什么版本、几个实例
        env:
          N: ${{ inputs.probe_instances }}
        run: |
          set -e
          echo "--- /api/health ---"
          curl -sS --max-time 20 "$BASE/api/health"; echo
          echo "--- 连问 ${N:-8} 次，看 instance 是不是同一个 ---"
          for i in $(seq 1 "${N:-8}"); do
            curl -sS --max-time 20 "$BASE/api/health" \
              | python3 -c 'import sys,json;d=json.load(sys.stdin);b=d.get("build",{});print(b.get("instance","(这版还没有 instance 字段)"), b.get("commit"))'
          done

      - name: 测试账号名下到底有没有作品
        env:
          U: ${{ secrets.E2E_USERNAME }}
          P: ${{ secrets.E2E_PASSWORD }}
        run: |
          set -e
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request
          BASE = os.environ["BASE"]
          body = json.dumps({"username": os.environ["U"], "password": os.environ["P"]}).encode()
          req = urllib.request.Request(f"{BASE}/api/auth/login", method="POST", data=body,
                                       headers={"content-type": "application/json"})
          with urllib.request.urlopen(req, timeout=60) as r:
              me = json.loads(r.read().decode())
              cookie = r.headers.get("set-cookie", "").split(";")[0]
          print("登录成功：", me.get("user"))
          print("::add-mask::" + cookie.split("=", 1)[1])

          def get(path):
              rq = urllib.request.Request(f"{BASE}{path}", headers={"cookie": cookie})
              with urllib.request.urlopen(rq, timeout=60) as r:
                  return json.loads(r.read().decode())

          games = get("/api/auth/games").get("games") or []
          print(f"\n账号名下作品 {len(games)} 部：")
          for g in games[:30]:
              print(f"  - {g['id']}  {g.get('title')}  mode={g.get('mode')}  updated={g.get('updatedAt')}")

          # 公开库还剩多少——顺便验证数据库有没有被部署冲掉
          try:
              pub = get("/api/games")
              lst = pub.get("games") if isinstance(pub, dict) else pub
              print(f"\n公开游戏库 {len(lst or [])} 部（数据库还在不在，看这个数）")
          except Exception as e:
              print("取公开库失败：", e)
          PY

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: 手机上真打开一遍线上网站
        run: |
          set -e
          node - <<'JS'
          const { chromium } = require("playwright");
          const BASE = process.env.BASE;
          (async () => {
            const browser = await chromium.launch();
            let bad = 0;
            // 老板报的是「手机端玩不了」。这里就按手机来量：三个常见宽度，
            // 每一页都看**能不能横着拖**（能拖 = 排版坏了）。
            for (const w of [320, 390, 430]) {
              const ctx = await browser.newContext({
                viewport: { width: w, height: 844 }, isMobile: true, hasTouch: true,
                userAgent: "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1",
              });
              const page = await ctx.newPage();
              for (const path of ["/", "/mine", "/new", "/login", "/g/xiuxian", "/g/cold-case"]) {
                try {
                  await page.goto(BASE + path, { waitUntil: "networkidle", timeout: 60000 });
                  await page.waitForTimeout(1200);
                  const r = await page.evaluate(() => ({
                    s: document.documentElement.scrollWidth,
                    c: document.documentElement.clientWidth,
                    vp: !!document.querySelector('meta[name="viewport"]'),
                  }));
                  const over = r.s > r.c + 1;
                  if (over) bad++;
                  console.log(`${w}px ${path}: scroll=${r.s} client=${r.c} viewport=${r.vp ? "有" : "无"} ${over ? "❌ 横向溢出" : "✓"}`);
                } catch (e) {
                  console.log(`${w}px ${path}: 打不开 —— ${e.message.slice(0, 120)}`);
                  bad++;
                }
              }
              await ctx.close();
            }
            await browser.close();
            if (bad > 0) {
              console.log(`::error::手机上有 ${bad} 处不对劲`);
              process.exit(1);
            }
            console.log("手机端体检全过 ✓");
          })();
          JS
