name: AI 端到端实测

# 让**线上的 AI 策划**自己做一遍游戏，看它从一段创作者的话出发能走多远。
#
# 为什么要放在 GitHub Actions 里：开发容器的出口屏蔽了 railway.app，调不到线上服务；
# Actions 能直接访问线上站点。AI 密钥全程留在服务端，这里一个字都不经手。
#
# 手动触发。产出：AI 每一轮的回复、它写进配置的东西、以及线上校验器的判定。

on:
  workflow_dispatch:
    inputs:
      brief:
        description: "创作者的一段话（就当自己是用户在工作台里打的第一句）"
        required: false
        default: "我想做一个王者荣耀的电竞经理游戏。玩家是一支 KPL 战队的经理，每周有几个行动点，可以训练队员、谈转会、跑商务。周末打联赛，赛季末进季后赛。选手要有细分能力和分路，首发五人分路要配齐。三个赛季，打不好会被俱乐部换掉。"
      rounds:
        description: "跟 AI 聊几轮（每轮会把上一轮的回复带上）"
        required: false
        default: "6"
      followups:
        description: "后续几轮说什么，用 ||| 分隔；用完了就重复最后一句"
        required: false
        default: "方案可以，按这个开搭。|||继续，把选手名单和赛程补完。|||跑一下校验和模拟，把问题修掉。"
      template:
        description: "作品形态：blank-story/blank-life/blank-sim 是快速模式，blank-code 是自由模式（AI 自己写页面）"
        required: false
        default: "blank-story"

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      BASE: https://word-game-platform-production.up.railway.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      # 等线上真的是这次要测的代码再开始。
      #
      # 之前几次实测的结论全被这件事污染过：我一边改一边推，每次推送都触发
      # Railway 重新部署、容器重启，而实测的窗口正好压在上面——于是 502 到底是
      # 平台的毛病还是我自己推挂的，分不清。测一个会动的靶子等于没测。
      - name: 等部署跟上（线上 commit 要对得上这次的 sha）
        run: |
          set -e
          want="$(echo "${{ github.sha }}" | cut -c1-7)"
          echo "要等的 commit：$want"
          for i in $(seq 1 40); do
            got="$(curl -sS --max-time 10 "$BASE/api/health" | sed -n 's/.*"commit":"\([^"]*\)".*/\1/p' || true)"
            if [ "$got" = "$want" ]; then
              echo "线上已经是 $got，等 20 秒让容器彻底稳下来"
              sleep 20
              exit 0
            fi
            echo "  线上还是 ${got:-取不到}，15 秒后再看（第 $i 次）"
            [ "$got" = "unknown" ] && unknowns=$((${unknowns:-0} + 1))
            sleep 15
          done
          # 连着报 unknown 说明服务是活的、只是它不知道自己是哪个版本——
          # 那是走了 `railway up` 那条不带 git 元数据的部署路子（第 10 次实测踩的坑）。
          # 现在 CI 会把 sha 写进 public/build.json，只要线上跑的是带这条修复的代码就不会再有。
          if [ "${unknowns:-0}" -ge 8 ]; then
            echo "::error::线上一直报 commit=unknown：服务活着，但它不知道自己是哪个版本。"
            echo "::error::多半是这次上线走了 railway up（没有 git 元数据）而线上代码还早于「把 commit 写进构建产物」那次修复。再推一次即可。"
            exit 1
          fi
          echo "::error::等了 10 分钟线上还没跟上（要 $want）。别在会动的靶子上测——先确认部署再重跑。"
          exit 1

      # 额度规矩：游客 40 万/天、注册 200 万、管理员不限量（老板定的）。
      # 实测烧得多，必须用平台测试账号（管理员）跑，配置方式见 valmanager-e2e.yml 里同名步骤。
      - name: 用平台测试账号登录（管理员＝不限量）
        id: login
        env:
          E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: |
          set -e
          if [ -z "$E2E_USERNAME" ] || [ -z "$E2E_PASSWORD" ]; then
            echo "::error::缺少 Actions Secrets：E2E_USERNAME / E2E_PASSWORD（配置三步见 valmanager-e2e.yml 的同名步骤注释）。"
            exit 1
          fi
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request
          BASE = os.environ["BASE"]
          body = json.dumps({"username": os.environ["E2E_USERNAME"], "password": os.environ["E2E_PASSWORD"]}).encode()
          req = urllib.request.Request(f"{BASE}/api/auth/login", method="POST", data=body,
                                       headers={"content-type": "application/json"})
          try:
              with urllib.request.urlopen(req, timeout=60) as r:
                  reply = json.loads(r.read().decode())
                  cookie = (r.headers.get("set-cookie") or "").split(";")[0]
          except urllib.error.HTTPError as e:
              raise SystemExit(f"::error::登录失败 HTTP {e.code}：{e.read().decode()[:200]}")
          if not cookie:
              raise SystemExit("::error::登录响应里没有会话 cookie")
          print(f"::add-mask::{cookie.split('=', 1)[-1]}")
          user = reply.get("user") or {}
          print(f"已登录：{user.get('username')}（角色 {user.get('role')}）")
          if user.get("role") != "admin":
              raise SystemExit("::error::测试账号还不是管理员——先提拔（后台，或 Railway 变量 ADMIN_USERS=这个用户名）再重跑。")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"cookie={cookie}\n")
          PY

      - name: 建一个空作品
        id: create
        env:
          TEMPLATE: ${{ inputs.template }}
        run: |
          set -e
          BODY=$(curl -sS -X POST "$BASE/api/games" \
            -H 'content-type: application/json' \
            -d "{\"title\":\"AI 端到端实测\",\"template\":\"${TEMPLATE:-blank-story}\"}")
          ID=$(echo "$BODY" | sed -n 's/.*"id":"\([^"]*\)".*/\1/p')
          KEY=$(echo "$BODY" | sed -n 's/.*"editKey":"\([^"]*\)".*/\1/p')
          if [ -z "$ID" ] || [ -z "$KEY" ]; then
            echo "::error::建作品失败：$BODY"; exit 1
          fi
          # 编辑钥匙等于这份作品的写权限，别落进公开日志
          echo "::add-mask::$KEY"
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          echo "作品已创建：$BASE/edit/$ID"

      - name: 跟线上 AI 策划对话
        env:
          GID: ${{ steps.create.outputs.id }}
          GKEY: ${{ steps.create.outputs.key }}
          COOKIE: ${{ steps.login.outputs.cookie }}
          BRIEF: ${{ inputs.brief }}
          ROUNDS: ${{ inputs.rounds }}
          FOLLOWUPS: ${{ inputs.followups }}
        run: |
          set -e
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error, time

          BASE = os.environ["BASE"]; GID = os.environ["GID"]; GKEY = os.environ["GKEY"]
          rounds = int(os.environ.get("ROUNDS") or 6)
          follow = [x for x in (os.environ.get("FOLLOWUPS") or "").split("|||") if x.strip()]
          msgs = [{"role": "user", "content": os.environ["BRIEF"]}]

          def post(path, payload, timeout=600):
              req = urllib.request.Request(
                  f"{BASE}{path}", method="POST",
                  data=json.dumps(payload).encode(),
                  headers={"content-type": "application/json", "x-edit-key": GKEY,
                           "cookie": os.environ.get("COOKIE", "")})
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return json.loads(r.read().decode())

          def post_retry(path, payload, tries=3):
              """502 多半是容器正在重启（部署中）或被网关掐了，退避重试两次再放弃。"""
              last = None
              for k in range(tries):
                  try:
                      return post(path, payload)
                  except urllib.error.HTTPError as e:
                      body = e.read().decode()[:300]
                      last = f"HTTP {e.code}：{body}"
                      if e.code not in (502, 503, 504):
                          raise
                      wait = 20 * (k + 1)
                      print(f"  ↻ {last} —— {wait}s 后重试（第 {k + 1} 次）")
                      time.sleep(wait)
                  except Exception as e:
                      last = str(e)
                      print(f"  ↻ {last} —— 20s 后重试（第 {k + 1} 次）")
                      time.sleep(20)
              raise RuntimeError(last or "未知失败")

          for i in range(rounds):
              print(f"\n{'=' * 70}\n第 {i + 1} 轮 · 创作者说：{msgs[-1]['content'][:120]}\n{'=' * 70}")
              t0 = time.time()
              try:
                  body = post_retry(f"/api/games/{GID}/assistant", {"messages": msgs})
              except Exception as e:
                  print(f"::warning::第 {i + 1} 轮失败：{e}")
                  break
              reply = body.get("reply", "")
              q = body.get("quota") or {}
              print(f"[{time.time() - t0:.0f}s] AI 回复：\n{reply[:2500]}")
              print(f"[额度] 已用 {q.get('used')} / 上限 {q.get('limit')}　身份 {q.get('kind')}")
              if body.get("config"):
                  c = body["config"]
                  print(f"[写入配置] 卡片 {len(c.get('cards', []))} 张 / 变量 {len(c.get('vars', []))} 个 / "
                        f"结局 {len(c.get('endings', []))} 个 / 决策 {len(c.get('actions') or [])} 个 / "
                        f"实体 {len(c.get('entities') or [])} 个")
              # 每轮之后看一眼作品长成什么样了：只看最后一轮的总量，
              # 看不出中间有没有停滞、有没有被整份重写
              try:
                  fr = urllib.request.Request(f"{BASE}/api/games/{GID}/files",
                                              headers={"x-edit-key": GKEY})
                  with urllib.request.urlopen(fr, timeout=60) as resp:
                      fl = json.loads(resp.read().decode()).get("files") or []
                  total = sum(f["size"] for f in fl)
                  print(f"[作品] {len(fl)} 个文件 / 共 {total} 字符：" +
                        "、".join(f"{f['path']} {f['size']}" for f in fl))
              except Exception as e:
                  print(f"[作品] 取文件清单失败：{e}")
              msgs.append({"role": "assistant", "content": reply})
              # 追问用完了就一直说「接着做」——反复念最后一句会把 AI 带进死循环
              nxt = follow[i] if i < len(follow) else "接着做，往下搭。"
              msgs.append({"role": "user", "content": nxt})
          PY

      - name: 把 AI 做出来的东西抓下来
        id: fetch
        env:
          GID: ${{ steps.create.outputs.id }}
          GKEY: ${{ steps.create.outputs.key }}
        run: |
          set -e
          curl -sS "$BASE/api/games/$GID" -H "x-edit-key: $GKEY" > /tmp/game.json
          python3 - <<'PY'
          import json
          d = json.load(open("/tmp/game.json"))
          c = d.get("config") or {}
          json.dump(c, open("templates/__e2e.json", "w"), ensure_ascii=False, indent=2)
          print("=== AI 最终做出了什么 ===")
          print("标题：", (c.get("meta") or {}).get("title"))
          print("调度器：", (c.get("driver") or {}).get("kind"))
          for k in ("vars", "cards", "endings", "actions", "entities", "settlements",
                    "leagues", "brackets", "pendings", "relations", "curves", "derived"):
              v = c.get(k)
              if v:
                  print(f"  {k}: {len(v)}")
          card = d.get("designCard") or ""
          print("设计卡状态：", card.splitlines()[0] if card else "（空）")
          print("设计卡字数：", len(card))
          PY

      - name: 过一遍平台自己的验收门槛（快速模式）
        # 三级校验零错误零警告 + 600 局模拟全结局可达 + 开局即死 0。
        # 这道门槛官方示例都要过——AI 自己做的东西也用同一把尺子量。
        # 自由模式不走通用引擎，这套尺子量不了它，跳过。
        if: inputs.template != 'blank-code'
        continue-on-error: true
        run: TEMPLATE=__e2e.json npx vitest run tests/adhoc-template.test.ts

      - name: 看看 AI 写了什么文件（自由模式）
        # 自由模式没有模拟器可跑，能机检的是这几条硬边界：
        # 有没有入口、有没有碰沙箱里用不了的东西、存档桥用没用对。
        if: inputs.template == 'blank-code'
        env:
          GID: ${{ steps.create.outputs.id }}
          GKEY: ${{ steps.create.outputs.key }}
        run: |
          set -e
          curl -sS "$BASE/api/games/$GID/files" -H "x-edit-key: $GKEY" > /tmp/files.json
          python3 - <<'PY'
          import json, os, urllib.request
          BASE = os.environ["BASE"]; GID = os.environ["GID"]; GKEY = os.environ["GKEY"]
          files = json.load(open("/tmp/files.json")).get("files") or []
          print("=== AI 写出来的文件 ===")
          for f in files:
              print(f"  {f['path']}  {f['size']} 字符")
          # 建作品时平台会先落起手三件套（index.html / style.css / game.js，合计约 4k 字符）。
          # 还是那三个文件、总量没涨，等于 AI 一个字都没写——
          # 这一步就该判失败，别让 run 显示绿色骗人。
          scaffold_set = {"index.html", "style.css", "game.js"}
          only_scaffold = ({f["path"] for f in files} <= scaffold_set
                           and sum(f["size"] for f in files) < 6000)
          if not files or only_scaffold:
              print("::error::AI 没有写任何文件——自由模式下这等于什么都没做")
              raise SystemExit(1)
          if not any(f["path"] == "index.html" for f in files):
              print("::warning::没有 index.html，这部作品打不开")

          def read(path):
              r = urllib.request.Request(f"{BASE}/api/games/{GID}/files?path={path}",
                                         headers={"x-edit-key": GKEY})
              with urllib.request.urlopen(r) as resp:
                  return json.loads(resp.read().decode()).get("content") or ""

          whole = "".join(read(f["path"]) for f in files)
          # 注释里提到这些词是在解释「为什么不能用」，不算违规；这里只做粗筛，报警告不拦
          for banned in ("localStorage", "sessionStorage", "document.cookie",
                         "indexedDB", "fetch(", "XMLHttpRequest", "WebSocket"):
              if banned in whole:
                  print(f"::warning::代码里出现了 {banned} —— 沙箱里用不了，游戏可能直接白屏")
          for need in ("wgp:ready", "wgp:save", "wgp:load"):
              if need not in whole:
                  print(f"::warning::没用 {need} —— 存档桥没接上")
          print(f"总字符数：{len(whole)}")
          PY

      # 文件写出来了不等于能玩。自由模式没有模拟器可跑，唯一靠谱的办法是
      # 像玩家一样真点一遍：打得开、有得点、点得动、存档能续、手机排得下。
      - name: 真玩一遍（自由模式）
        if: inputs.template == 'blank-code'
        env:
          GID: ${{ steps.create.outputs.id }}
          GKEY: ${{ steps.create.outputs.key }}
        run: |
          set -e
          # 先发布，这样 /p/:id 不带钥匙也进得去
          curl -sS -X POST "$BASE/api/games/$GID/publish" \
            -H "x-edit-key: $GKEY" -H 'content-type: application/json' \
            -d '{"published":true}' -o /dev/null
          npm i -D playwright@1.56.0 >/dev/null 2>&1 || npm i -D playwright >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          CHROME_PATH="$(node -e "const {chromium}=require('playwright');console.log(chromium.executablePath())")" \
            node scripts/smoke-freemode.mjs "$BASE" "$GID"

      # 实测的半成品不该挂在公开游戏库里——老板在首页上看到两张「AI 端到端实测」
      # 就是这么来的。发布只是为了让冒烟检查不带钥匙能进去，测完就撤。
      - name: 从公开游戏库撤下来
        if: always()
        env:
          GID: ${{ steps.create.outputs.id }}
          GKEY: ${{ steps.create.outputs.key }}
        run: |
          [ -z "$GID" ] && exit 0
          curl -sS -X POST "$BASE/api/games/$GID/publish" \
            -H "x-edit-key: $GKEY" -H 'content-type: application/json' \
            -d '{"published":false}' -o /dev/null || true
          echo "已从公开游戏库撤下（作者带钥匙仍可访问）"

      - name: 留个地址
        if: always()
        env:
          GID: ${{ steps.create.outputs.id }}
        run: echo "作品地址（拿编辑钥匙才能改，钥匙已在日志里打码）：$BASE/edit/$GID"
