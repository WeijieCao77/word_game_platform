name: VAL MANAGER 复刻实测

# 老板的验收标准只有一条：**用这个平台一比一复刻出 VAL MANAGER，功能和 UI 完全一样。**
# 这条流水线就是量这把尺子的。
#
# 跟通用的 ai-e2e 有两处关键不同：
# 1. 发给 AI 的不是我编的题材梗概，是从原作逐项抽出来的建造说明书
#    （templates/valmanager/spec.md）
# 2. **真实世界数据由平台传进作品**（78 队 / 518 人 / 5 名分析师），
#    不让 AI 自己编名单——编出来的跟「一模一样」不沾边，而且要烧掉整轮预算
#
# 产出三样：每轮的 token 与文件增长曲线、冒烟检查（真点一遍）、
# 以及**界面覆盖率**（原作 11 个主界面 + 12 个弹层，做出来几个）。

on:
  workflow_dispatch:
    inputs:
      rounds:
        description: "搭几轮（每轮把上一轮的回复带上）"
        required: false
        default: "12"
      auto_rounds:
        description: "脚本化的十步走完之后，交给「连续搭建」再自己跑几轮（0 = 不跑）"
        required: false
        default: "10"
      fix_rounds:
        description: "玩出问题后，让 AI 回炉修几轮"
        required: false
        default: "3"
      resume_game:
        description: "接着搭已有的作品（填作品 id，作品须归测试账号所有——无主的先在 /admin 划归；留空则新建）"
        required: false
        default: ""

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      BASE: https://word-game-platform-production.up.railway.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      # 等线上真的是这次要测的代码再开始——别在会动的靶子上测
      - name: 等部署跟上
        run: |
          set -e
          want="$(echo "${{ github.sha }}" | cut -c1-7)"
          echo "要等的 commit：$want"
          unknowns=0
          for i in $(seq 1 40); do
            got="$(curl -sS --max-time 10 "$BASE/api/health" | sed -n 's/.*"commit":"\([^"]*\)".*/\1/p' || true)"
            if [ "$got" = "$want" ]; then
              echo "线上已经是 $got，等 20 秒让容器彻底稳下来"
              sleep 20
              exit 0
            fi
            echo "  线上还是 ${got:-取不到}，15 秒后再看（第 $i 次）"
            [ "$got" = "unknown" ] && unknowns=$((unknowns + 1))
            sleep 15
          done
          if [ "$unknowns" -ge 8 ]; then
            echo "::error::线上一直报 commit=unknown：服务活着，但它不知道自己是哪个版本。"
            echo "::error::多半是这次上线走了 railway up（没有 git 元数据）而线上代码还早于「把 commit 写进构建产物」那次修复。再推一次即可。"
            exit 1
          fi
          echo "::error::等了 10 分钟线上还没跟上（要 $want）。先确认部署再重跑。"
          exit 1

      # 额度规矩是老板定死的：游客 40 万/天、注册 200 万、管理员不限量。
      # 实测一轮就要烧几百万 token，只能用平台自己的测试账号（管理员）跑——
      # 以前靠把游客日额度放宽到 4000 万来跑，等于为了测试把对外的闸门拆了，不许再犯。
      - name: 用平台测试账号登录（管理员＝不限量）
        id: login
        env:
          E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: |
          set -e
          if [ -z "$E2E_USERNAME" ] || [ -z "$E2E_PASSWORD" ]; then
            echo "::error::缺少 Actions Secrets：E2E_USERNAME / E2E_PASSWORD。"
            echo "::error::游客日额度是 40 万 token，撑不起实测；必须用平台的测试账号（管理员，不限量）。"
            echo "::error::配置三步：1) 在网站上注册一个测试账号；2) 把它提为管理员（后台提拔，或把 Railway 变量 ADMIN_USERS 设成这个用户名，下次登录自动提升）；3) 把用户名密码存进本仓库 Actions Secrets 的 E2E_USERNAME / E2E_PASSWORD。"
            exit 1
          fi
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request
          BASE = os.environ["BASE"]
          body = json.dumps({"username": os.environ["E2E_USERNAME"], "password": os.environ["E2E_PASSWORD"]}).encode()
          req = urllib.request.Request(f"{BASE}/api/auth/login", method="POST", data=body,
                                       headers={"content-type": "application/json"})
          try:
              with urllib.request.urlopen(req, timeout=60) as r:
                  reply = json.loads(r.read().decode())
                  cookie = (r.headers.get("set-cookie") or "").split(";")[0]
          except urllib.error.HTTPError as e:
              raise SystemExit(f"::error::登录失败 HTTP {e.code}：{e.read().decode()[:200]} —— 检查 E2E_USERNAME/E2E_PASSWORD（账号要先在网站上注册）。")
          if not cookie:
              raise SystemExit("::error::登录响应里没有会话 cookie")
          # 会话 cookie 是凭据：先打码再写进 output
          print(f"::add-mask::{cookie.split('=', 1)[-1]}")
          user = reply.get("user") or {}
          print(f"已登录：{user.get('username')}（角色 {user.get('role')}）")
          if user.get("role") != "admin":
              raise SystemExit("::error::测试账号还不是管理员，按注册用户只有 200 万总额度，实测必然中途断。先提为管理员：后台提拔，或设 Railway 变量 ADMIN_USERS=这个用户名（登录时自动提升），再重跑。")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"cookie={cookie}\n")
          PY

      # 新建的作品带着登录态创建，直接归测试账号所有——之后凭登录态就能编辑，
      # 下次实测把作品 id 填进 resume_game 就能**接着上次的成果续搭**，全程不碰编辑钥匙
      # （钥匙不能进 workflow 输入，那会留在公开运行日志里）。
      # 更早的无主遗留（游客建的）要续搭，先在 /admin → 公开游戏库 → 「划归账号」划给测试账号。
      - name: 建作品并把真实数据传进去
        id: create
        env:
          RESUME: ${{ inputs.resume_game }}
          COOKIE: ${{ steps.login.outputs.cookie }}
        run: |
          set -e
          if [ -n "$RESUME" ]; then
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' "$BASE/api/games/$RESUME/files" -H "cookie: $COOKIE")
            if [ "$CODE" != "200" ]; then
              echo "::error::测试账号打不开这部作品（HTTP $CODE）。确认 id 没写错，且它已归属测试账号（无主的先在 /admin → 公开游戏库 → 划归账号）。"
              exit 1
            fi
            echo "id=$RESUME" >> "$GITHUB_OUTPUT"
            echo "key=" >> "$GITHUB_OUTPUT"
            echo "接着搭已有作品：$BASE/edit/$RESUME（数据表沿用作品里已有的，不再上传）"
            exit 0
          fi
          BODY=$(curl -sS -X POST "$BASE/api/games" \
            -H 'content-type: application/json' -H "cookie: $COOKIE" \
            -d '{"title":"VAL MANAGER（平台复刻）","template":"blank-code"}')
          ID=$(echo "$BODY" | sed -n 's/.*"id":"\([^"]*\)".*/\1/p')
          KEY=$(echo "$BODY" | sed -n 's/.*"editKey":"\([^"]*\)".*/\1/p')
          if [ -z "$ID" ] || [ -z "$KEY" ]; then echo "::error::建作品失败：$BODY"; exit 1; fi
          echo "::add-mask::$KEY"
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          echo "作品已创建：$BASE/edit/$ID"

          # 真实世界数据进作品的 data/ 目录。
          # 沙箱里 connect-src 'none'，作品读不到 .csv——平台会给每张表虚拟一个
          # 同名的 data/xxx.js，作品 <script src> 引进来、WGP.data("xxx") 取用。
          # id 与钥匙走环境变量传给 python，别写进命令行（命令行会进日志）
          export GID="$ID" GKEY="$KEY"
          python3 - <<'PY'
          import json, os, urllib.request
          BASE = os.environ["BASE"]; GID = os.environ["GID"]; GKEY = os.environ["GKEY"]
          COOKIE = os.environ["COOKIE"]  # 作品归测试账号所有，授权凭登录态
          for name in ("teams", "players", "analysts"):
              path = f"templates/valmanager/data/{name}.csv"
              content = open(path, encoding="utf-8").read()
              req = urllib.request.Request(
                  f"{BASE}/api/games/{GID}/files", method="PUT",
                  data=json.dumps({"path": f"data/{name}.csv", "content": content}).encode(),
                  headers={"content-type": "application/json", "x-edit-key": GKEY, "cookie": COOKIE})
              with urllib.request.urlopen(req, timeout=120) as r:
                  r.read()
              print(f"  已传 data/{name}.csv（{len(content)} 字符）")
          PY

      - name: 让线上 AI 照着说明书搭
        env:
          GID: ${{ steps.create.outputs.id }}
          GKEY: ${{ steps.create.outputs.key }}
          COOKIE: ${{ steps.login.outputs.cookie }}
          ROUNDS: ${{ inputs.rounds }}
          AUTO_ROUNDS: ${{ inputs.auto_rounds }}
        run: |
          set -e
          python3 - <<'PY'
          import json, os, time, urllib.error, urllib.request

          BASE = os.environ["BASE"]; GID = os.environ["GID"]; GKEY = os.environ["GKEY"]
          COOKIE = os.environ["COOKIE"]  # 测试账号（管理员）的会话，额度按不限量算
          rounds = int(os.environ.get("ROUNDS") or 12)
          auto_rounds = int(os.environ.get("AUTO_ROUNDS") or 0)
          spec = open("templates/valmanager/spec.md", encoding="utf-8").read()

          # 第一轮把整份说明书发过去；之后按 spec 第七节的十步往下走，
          # 用完了就一直说「接着做」——这正是创作者搭大作品时的真实说法
          steps = [
              "开搭。先把骨架和数据接上：读三张表，做出顶部导航（11 个界面按组分栏）和总览页。",
              "阵容页：我的首发五人和替补，可排序表格，点一行开选手详情（八维 + 特点 + 合同）。",
              "赛程和积分榜：按 336 天的日历排赛程，积分榜按联赛分组。",
              "比赛：地图 ban/pick、逐回合模拟、回合条带、战术暂停、优势拆解，一个都不能少。",
              "训练：每人专项 + 全队集训 + 双人搭档，计划确认后锁定一周。",
              "转会：多维报价评分、挂牌、解约、AI 战队之间自己也在转会。",
              "商务、财务、教练组、设施升级这四块补上。",
              "关系三轴（士气/怨气/信任）+ 两两羁绊 + 生活事件（伤病/退役/更衣室矛盾）。",
              "生涯：年度目标、下课、应聘下一家、跨赛季继承。记住这个游戏没有结局。",
              "打磨：存档、每日简报、教程、手机适配。",
          ]

          msgs = [{"role": "user", "content": spec}]
          fails = 0

          def post_retry(path, payload, tries=3):
              last = None
              for k in range(tries):
                  try:
                      req = urllib.request.Request(
                          f"{BASE}{path}", method="POST",
                          data=json.dumps(payload).encode(),
                          headers={"content-type": "application/json", "x-edit-key": GKEY, "cookie": COOKIE})
                      with urllib.request.urlopen(req, timeout=900) as r:
                          return json.loads(r.read().decode())
                  except urllib.error.HTTPError as e:
                      last = f"HTTP {e.code}：{e.read().decode()[:300]}"
                      if e.code not in (502, 503, 504):
                          raise
                      print(f"  ↻ {last} —— {20 * (k + 1)}s 后重试")
                      time.sleep(20 * (k + 1))
                  except Exception as e:
                      last = str(e)
                      print(f"  ↻ {last} —— 20s 后重试")
                      time.sleep(20)
              raise RuntimeError(last or "未知失败")

          def run_round(payload_msgs, n=1):
              """跑一轮（或连着跑 n 轮）——走**异步任务**那条路。

              以前这里是同步 POST 干等回信，那条路一轮只有 180 秒预算，而且
              最重的那一轮必然被网关掐成 502。异步之后：请求立刻拿到任务号，
              活在后台跑（单轮 12 分钟），这里每 5 秒问一次跑完没有。
              **这也才是创作者在工作台里真实走的那条路**——实测就该测那一条。
              """
              body = post_retry(f"/api/games/{GID}/assistant",
                                {"messages": payload_msgs, "async": True, "rounds": n})
              job = body.get("jobId")
              if not job:
                  return body  # 老版本线上还没有异步，原样返回
              # n 轮 × 12 分钟，再宽一点：留足够的余量，别自己先放弃
              deadline = time.time() + 60 * 20 * max(1, n)
              note = ""
              while time.time() < deadline:
                  time.sleep(5)
                  try:
                      rq = urllib.request.Request(
                          f"{BASE}/api/games/{GID}/assistant?job={job}",
                          headers={"x-edit-key": GKEY, "cookie": COOKIE})
                      with urllib.request.urlopen(rq, timeout=60) as r:
                          jb = json.loads(r.read().decode())
                  except Exception:
                      continue  # 网络抖一下不该让这一轮白跑
                  st = (jb.get("job") or {}).get("status")
                  nn = (jb.get("job") or {}).get("note") or ""
                  if nn and nn != note:
                      note = nn
                      print(f"  · {note}")
                  if st == "done":
                      return jb
                  if st == "error":
                      raise RuntimeError((jb.get("job") or {}).get("error") or "这一轮失败了")
              raise RuntimeError(f"等了 {60 * 20 * max(1, n)} 秒还没跑完")

          def snapshot(tag):
              try:
                  req = urllib.request.Request(f"{BASE}/api/games/{GID}/files",
                                               headers={"x-edit-key": GKEY, "cookie": COOKIE})
                  with urllib.request.urlopen(req, timeout=120) as r:
                      files = json.loads(r.read().decode()).get("files") or []
                  code = [f for f in files if not f["path"].startswith("data/")]
                  total = sum(f["size"] for f in code)
                  print(f"[{tag}] 作品代码 {len(code)} 个文件 / 共 {total} 字符：" +
                        "、".join(f"{f['path']} {f['size']}" for f in sorted(code, key=lambda x: -x["size"])[:8]))
                  return total
              except Exception as e:
                  print(f"[{tag}] 取文件清单失败：{e}")
                  return 0

          before = snapshot("起手")
          for i in range(rounds):
              said = msgs[-1]["content"]
              print(f"\n{'=' * 70}\n第 {i + 1} 轮 · 创作者说：{said[:100]}\n{'=' * 70}")
              t0 = time.time()
              try:
                  body = run_round(msgs)
              except Exception as e:
                  # 单轮失败**不能**打死全场。第 2 次实测就栽在这儿：第 1 轮撞了三次 502
                  # 就 break 出去，14 轮一轮没跑，最后还报了绿。
                  # 服务端是「改一次存一次」的，那一轮的活其实做了，只是回信丢在网关上——
                  # 所以跳过它接着往下走才对。连着三轮都失败才是真的不对劲。
                  print(f"::warning::第 {i + 1} 轮失败：{e}")
                  fails += 1
                  if fails >= 3:
                      print("::error::连着三轮都失败，线上多半出问题了，不再往下跑")
                      break
                  msgs.append({"role": "user", "content": steps[i] if i < len(steps) else "接着做，往下搭。"})
                  continue
              fails = 0
              reply = body.get("reply", "")
              q = body.get("quota") or {}
              print(f"[{time.time() - t0:.0f}s] AI 回复：\n{reply[:1800]}")
              print(f"[额度] 已用 {q.get('used')} / 上限 {q.get('limit')}　身份 {q.get('kind')}")
              now = snapshot(f"第 {i + 1} 轮后")
              print(f"[增长] 这一轮 +{now - before} 字符")
              before = now
              msgs.append({"role": "assistant", "content": reply})
              msgs.append({"role": "user", "content": steps[i] if i < len(steps) else "接着做，往下搭。"})

          # 连续搭建：脚本化的十步走完之后，把剩下的活整个交给平台自己跑。
          #
          # 这一段测的正是差距的大头——**没跑够**。原作 13,132 行，最好的一次
          # 12 轮才到约 4,500 行；靠人一句句催永远补不上那个差额。
          # 这里一个请求丢过去，服务端一轮接一轮地搭，中间不用任何人说话。
          if auto_rounds > 0:
              print(f"\n{'=' * 70}\n连续搭建：接下来 {auto_rounds} 轮由平台自己跑，中间没人催\n{'=' * 70}")
              t0 = time.time()
              try:
                  body = run_round(msgs, n=auto_rounds)
                  print(f"[{time.time() - t0:.0f}s] 实际跑了 {body.get('roundsRun')} 轮")
                  if body.get("stoppedBecause"):
                      print(f"::warning::连续搭建提前停了：{body['stoppedBecause']}")
                  print(f"最后一轮的回复：\n{(body.get('reply') or '')[:1800]}")
                  q = body.get("quota") or {}
                  print(f"[额度] 已用 {q.get('used')} / 上限 {q.get('limit')}　身份 {q.get('kind')}")
              except Exception as e:
                  print(f"::warning::连续搭建失败：{e}")
              now = snapshot("连续搭建后")
              print(f"[增长] 连续搭建这一段 +{now - before} 字符")
              before = now
          PY

      - name: 界面覆盖率（离「一模一样」还差几个界面）
        env:
          GID: ${{ steps.create.outputs.id }}
          GKEY: ${{ steps.create.outputs.key }}
          COOKIE: ${{ steps.login.outputs.cookie }}
        run: |
          set -e
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          BASE = os.environ["BASE"]; GID = os.environ["GID"]; GKEY = os.environ["GKEY"]
          COOKIE = os.environ["COOKIE"]

          req = urllib.request.Request(f"{BASE}/api/games/{GID}/files", headers={"x-edit-key": GKEY, "cookie": COOKIE})
          with urllib.request.urlopen(req, timeout=120) as r:
              files = json.loads(r.read().decode()).get("files") or []
          code = [f for f in files if not f["path"].startswith("data/")]
          if not code:
              print("::error::作品里一个代码文件都没有")
              raise SystemExit(1)

          def read(path):
              rq = urllib.request.Request(
                  f"{BASE}/api/games/{GID}/files?path={urllib.parse.quote(path)}",
                  headers={"x-edit-key": GKEY, "cookie": COOKIE})
              with urllib.request.urlopen(rq, timeout=120) as resp:
                  return json.loads(resp.read().decode()).get("content") or ""
          whole = "".join(read(f["path"]) for f in code)

          # 原作的 11 个主界面 + 12 个弹层/专属组件。
          #
          # **这个数只能当参考，不能当结论。** 它扫的是源码里有没有这几个词，
          # 而实测里真撞见过这种页面：
          #     积分榜 · 建造中 / 规划：按联赛分组的真实积分榜 / 第 3 轮上线
          # 它照样让「积分榜 ✓」——一个骗人的空壳反而让分数更好看。
          # 真正算数的是后面那步「界面体检」：点进每一页看有没有东西。
          SCREENS = {
              "总览": ["总览", "Dashboard", "dashboard"],
              "阵容": ["阵容", "Squad", "squad"],
              "战术": ["战术", "Tactics", "tactics"],
              "训练": ["训练", "Training", "training"],
              "转会": ["转会", "Transfers", "transfers"],
              "商务": ["商务", "Commercial", "commercial"],
              "财务": ["财务", "Finance", "finance"],
              "赛程": ["赛程", "Schedule", "schedule"],
              "积分榜": ["积分榜", "Standings", "standings"],
              "经理生涯": ["生涯", "Career", "career"],
              "存档": ["存档", "Saves", "saves"],
          }
          PARTS = {
              "选手详情": ["选手详情", "PlayerModal", "playerModal"],
              "赛前布置": ["赛前布置", "MatchModal", "matchModal"],
              "逐回合直播": ["逐回合", "MatchLive", "matchLive", "回合直播"],
              "回合条带": ["回合条带", "RoundRibbon", "roundRibbon"],
              "战术滑条": ["滑条", "TacticSliders", "tacticSlider"],
              "优势拆解": ["优势拆解", "WhyPanel", "whyPanel", "EdgeBreakdown"],
              "对阵表": ["对阵表", "Bracket", "bracket"],
              "合同条款": ["合同条款", "ContractTerms", "contractTerms"],
              "每日简报": ["简报", "Digest", "digest"],
              "地图ban/pick": ["ban", "Ban", "禁用"],
              "战术暂停": ["暂停", "timeout", "Timeout"],
              "教练组": ["教练组", "分析师", "Staff", "staff"],
          }
          def report(title, spec):
              hit = [k for k, keys in spec.items() if any(x in whole for x in keys)]
              miss = [k for k in spec if k not in hit]
              print(f"\n{title}：{len(hit)} / {len(spec)}")
              print(f"  有：{'、'.join(hit) or '（一个都没有）'}")
              print(f"  缺：{'、'.join(miss) or '（都齐了）'}")
              return len(hit), len(spec)

          print(f"=== 作品代码 {len(code)} 个文件 / 共 {len(whole)} 字符（原作 13,132 行）===")
          for f in sorted(code, key=lambda x: -x["size"]):
              print(f"  {f['path']}  {f['size']} 字符")
          a, at = report("主界面", SCREENS)
          b, bt = report("弹层与专属组件", PARTS)
          print(f"\n=== 源码里提到了：{a + b} / {at + bt}（**只是提到，不代表做出来了**）===")
          print("    真正算数的是下面那步「界面体检」——点进每一页看有没有真东西。")

          # 数据到底用没用上——编名单是这次实测最要防的一件事
          used = [n for n in ("players", "teams", "analysts") if f'WGP.data("{n}")' in whole or f"WGP.data('{n}')" in whole]
          print(f"用上的真实数据表：{'、'.join(used) or '（一张都没用——它多半自己编了名单）'}")
          PY

      - name: 真玩一遍
        env:
          GID: ${{ steps.create.outputs.id }}
          GKEY: ${{ steps.create.outputs.key }}
          COOKIE: ${{ steps.login.outputs.cookie }}
        run: |
          set -e
          curl -sS -X POST "$BASE/api/games/$GID/publish" \
            -H "x-edit-key: $GKEY" -H "cookie: $COOKIE" -H 'content-type: application/json' \
            -d '{"published":true}' -o /dev/null
          npm i -D playwright@1.56.0 >/dev/null 2>&1 || npm i -D playwright >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          CHROME="$(node -e "const {chromium}=require('playwright');console.log(chromium.executablePath())")"
          echo "$CHROME" > /tmp/chrome-path
          # 结论要留下来喂回给 AI，所以别让它在这里就把作业判死
          CHROME_PATH="$CHROME" node scripts/smoke-freemode.mjs "$BASE" "$GID" | tee /tmp/smoke.txt
          echo "${PIPESTATUS[0]}" > /tmp/smoke.code

      # 源码里出现「阵容」两个字太容易了——写个导航按钮就有。
      # 这一步问的是**点进去之后有没有东西**：每一页的字数、可点元素、表格行数、报错。
      - name: 界面体检（每一页点进去有没有真东西）
        if: always()
        env:
          GID: ${{ steps.create.outputs.id }}
        run: |
          CHROME_PATH="$(cat /tmp/chrome-path 2>/dev/null || true)" \
            node scripts/screens-freemode.mjs "$BASE" "$GID" 2>&1 | tee /tmp/screens.txt
          echo "${PIPESTATUS[0]}" > /tmp/screens.code
          exit 0

      # 闭环：真玩一遍发现的问题，作为创作者的下一句话喂回去，让 AI 自己修完再判。
      #
      # 这是自由模式一直缺的那一环。快速模式写错了会被三级校验当场打回、自动重试；
      # 自由模式原本 AI 写完就交差——它永远不知道自己的游戏在浏览器里炸了。
      - name: 把玩出来的问题喂回去让它修
        if: always()
        env:
          GID: ${{ steps.create.outputs.id }}
          GKEY: ${{ steps.create.outputs.key }}
          COOKIE: ${{ steps.login.outputs.cookie }}
          FIX_ROUNDS: ${{ inputs.fix_rounds }}
        run: |
          set -e
          python3 - <<'PY'
          import json, os, time, urllib.error, urllib.request

          BASE = os.environ["BASE"]; GID = os.environ["GID"]; GKEY = os.environ["GKEY"]
          rounds = int(os.environ.get("FIX_ROUNDS") or 3)

          def read(path):
              try:
                  return open(path, encoding="utf-8").read().strip()
              except Exception:
                  return ""

          def ask(text):
              req = urllib.request.Request(
                  f"{BASE}/api/games/{GID}/assistant", method="POST",
                  data=json.dumps({"messages": [{"role": "user", "content": text}]}).encode(),
                  headers={"content-type": "application/json", "x-edit-key": GKEY,
                           "cookie": os.environ.get("COOKIE", "")})
              with urllib.request.urlopen(req, timeout=900) as r:
                  return json.loads(r.read().decode())

          def play(script):
              import subprocess
              env = dict(os.environ)
              env["CHROME_PATH"] = read("/tmp/chrome-path")
              out = subprocess.run(["node", script, BASE, GID],
                                   capture_output=True, text=True, env=env)
              return out.returncode, (out.stdout or "") + (out.stderr or "")

          smoke = read("/tmp/smoke.txt")
          screens = read("/tmp/screens.txt")
          # 用退出码判，不要靠在输出里猜关键词。第 2 次实测就是这么放过去的：
          # 界面体检明明说「找不到任何导航——只有一屏」，可那句话里没有「硬伤/占位/报错」
          # 任何一个词，条件没命中，回炉一轮都没跑，然后报了绿。
          bad = read("/tmp/smoke.code") != "0" or read("/tmp/screens.code") != "0"
          if not bad:
              print("玩了一遍没发现问题，不用回炉。")
              raise SystemExit(0)

          for i in range(rounds):
              msg = (
                  "我把你做的游戏真点了一遍，发现了问题。**这一轮只做一件事：把它们修好**，"
                  "不要加新功能。\n\n"
                  "先用 read_errors 看浏览器里抛了什么异常（那是最直接的线索），"
                  "再对着下面的检查结果逐条排查；改完用 patch_file，别整份重写。\n\n"
                  f"【真玩一遍】\n{smoke}\n\n【界面体检】\n{screens}"
              )
              print(f"\n{'=' * 70}\n回炉第 {i + 1} 轮\n{'=' * 70}")
              try:
                  body = ask(msg)
              except Exception as e:
                  print(f"::warning::回炉第 {i + 1} 轮失败：{e}")
                  break
              print((body.get("reply") or "")[:1500])
              q = body.get("quota") or {}
              print(f"[额度] 已用 {q.get('used')} / 上限 {q.get('limit')}")

              time.sleep(3)
              scode, sout = play("scripts/smoke-freemode.mjs")
              ncode, nout = play("scripts/screens-freemode.mjs")
              print(sout)
              print(nout)
              smoke, screens = sout.strip(), nout.strip()
              if scode == 0 and ncode == 0:
                  print(f"回炉 {i + 1} 轮之后，玩一遍和界面体检都过了。")
                  raise SystemExit(0)

          print("::warning::回炉之后仍有硬伤——这一条要作为平台的卡点记下来")
          PY

      # 实测的半成品不该挂在公开游戏库里。
      # 老板的原话是「不是现在游戏库里的那种垃圾」——那正是要避免的观感。
      # 发布只是为了让冒烟检查能不带钥匙进去，测完就撤下来；作者带钥匙照样能看能改。
      - name: 从公开游戏库撤下来
        if: always()
        env:
          GID: ${{ steps.create.outputs.id }}
          GKEY: ${{ steps.create.outputs.key }}
          COOKIE: ${{ steps.login.outputs.cookie }}
        run: |
          curl -sS -X POST "$BASE/api/games/$GID/publish" \
            -H "x-edit-key: $GKEY" -H "cookie: $COOKIE" -H 'content-type: application/json' \
            -d '{"published":false}' -o /dev/null || true
          echo "已从公开游戏库撤下（作者带钥匙仍可访问）"

      # 一条明面上的门槛：达不到就判红，别再出现「19k 字符一屏也算 success」。
      - name: 够不够格（硬门槛）
        if: always()
        run: |
          set -e
          smoke="$(cat /tmp/smoke.code 2>/dev/null || echo 1)"
          screens="$(cat /tmp/screens.code 2>/dev/null || echo 1)"
          echo "冒烟检查退出码 $smoke / 界面体检退出码 $screens"
          fail=0
          [ "$smoke" = "0" ] || { echo "::error::真玩一遍没过"; fail=1; }
          [ "$screens" = "0" ] || { echo "::error::界面体检没过——有界面是空的、坏的，或者压根没有多界面结构"; fail=1; }
          exit $fail

      - name: 留个地址
        if: always()
        env:
          GID: ${{ steps.create.outputs.id }}
        run: echo "作品：$BASE/p/$GID　（工作台 $BASE/edit/$GID，编辑钥匙已打码）"
